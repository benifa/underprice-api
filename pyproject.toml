[project]
name = "underprice-api"
version = "0.1.0"
description = "Production backend for Underprice — modular agents, specialist cascade, and FastAPI for deal scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "typer>=0.15",
    "psycopg[binary]>=3.2",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
modal = [
    "modal>=1.1",
]
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=0.34",
    "huggingface-hub>=0.25",
]

[project.scripts]
underprice = "underprice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underprice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
